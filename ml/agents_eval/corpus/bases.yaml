# Capturas limpias de las que se siembra (guía de entrenamiento 11.2).
#
# Son la mitad limpia del conjunto y, a la vez, el punto de partida de la mitad sembrada: cada
# perturbación se aplica sobre una de estas, así que un falso positivo y un verdadero positivo se
# miden sobre la misma captura y la diferencia es la perturbación y nada más.
#
# Variadas a propósito. Un conjunto de diez copias del mismo caso da una precisión preciosa y no
# dice nada: lo que descubre un falso positivo es la captura legítima que se parece a un problema
# —la cuadrilla que trabajó al borde de la tolerancia del GPS, la que cerró en cinco minutos, la
# que aceptó una propuesta de IA con confianza justa— y esas son las que hay que tener aquí.
#
# Nada de nombres del modelo de datos de CNEL (regla 4): los campos son las claves canónicas del
# perfil sintético.

