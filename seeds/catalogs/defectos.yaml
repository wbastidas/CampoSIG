# Defectos que una inspección puede registrar (bloques B05 y B11).
#
# Línea base del sector eléctrico de distribución, para los seis tipos de activo del piloto. Cada
# área tiene que validarla: un código que nadie usa es ruido en el selector, y uno que falta obliga
# al técnico a escribirlo en observaciones, que es donde la información se pierde.
#
# `attributes.suggested_criticality` es una sugerencia, no un veredicto: el formulario pide la
# criticidad y la persona la confirma. Un defecto que llegara con criticidad ya puesta sería una
# decisión que nadie tomó.
catalog:
  code: defect
  title: Defecto encontrado
  source: manual
entries:
  # --- Estructura de soporte ---
  - code: poste_inclinado
