# División política del Ecuador (bloque B02).
#
# ============================ LEER ANTES DE USAR ============================
# Las 24 provincias están completas porque son estables y públicas. Los cantones (~221) y las
# parroquias (~1 500) quedan **vacíos a propósito**: la lista oficial es del INEC y nadie de este
# equipo la ha transcrito. Inventarla parcialmente sería peor que no tenerla — un cantón mal escrito
# en miles de OT no se arregla después, y la exportación al regulador lo lleva.
#
# Mientras estén vacíos, el selector correspondiente sale vacío y la pantalla de catálogos lo dice
# con la nota de abajo, en vez de parecer un formulario roto.
# ============================================================================
