<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="SIGEC-Campo">
  <!-- Una estructura de distribución: poste, cruceta y tres aisladores. Es lo que la
       plataforma inventaría, y se distingue a 16 px, que es el único requisito real. -->
  <rect width="32" height="32" rx="5" fill="#1e3a5f"/>
  <g stroke="#f5f5f4" stroke-width="2" stroke-linecap="round" fill="none">
    <line x1="16" y1="7" x2="16" y2="26"/>
    <line x1="7" y1="11" x2="25" y2="11"/>
  </g>
  <g fill="#fbbf24">
    <circle cx="7" cy="11" r="2"/>
    <circle cx="16" cy="9" r="2"/>
    <circle cx="25" cy="11" r="2"/>
  </g>
</svg>
