# Bloque específico de atención de luminaria en falla (F-AP-01, SRS 4.6).
#
# Los «elementos reemplazados» estaban aquí como tabla propia y ahora los lleva **B07 Materiales**,
# que es el bloque común. El SRS nombra la tabla dos veces —como bloque común y dentro de este
# formulario— y es la misma información: dos tablas obligarían al conector del ERP a leer en dos
# sitios, y uno de los dos se desviaría. B07 además distingue instalado de retirado, que es lo que el
# ERP necesita para mover el inventario en los dos sentidos.
block:
  code: AP01
  title: Luminaria en falla
  required: true
fields:
  claim_number: {type: string, title: N.º de reclamo, x-voice: false}
  claim_at: {type: string, format: date-time, title: Fecha-hora del reclamo, x-voice: false}
  reported_failure:
    type: string
    title: Tipo de falla reportada
    enum: [apagada_de_noche, encendida_de_dia, intermitente, danada_fisicamente]
    x-voice: true
  cause_found:
    type: string
    title: Causa encontrada
    enum: [lampara_o_modulo, driver_o_balasto, fotocontrol, fusible, conexion, brazo, vandalismo, alimentacion]
    x-voice: true
  operative_at_close:
    type: boolean
    title: Luminaria operativa al finalizar
    x-voice: true
    x-vision-source: lamp_lit
  restored_at:
    type: string
    format: date-time
    title: Fecha-hora de reposición del servicio
    x-voice: false
  # Calculado: cierre menos reclamo, contra el máximo de regulatory_parameter (ADR-007).
  restoration_hours:
    type: number
    title: Tiempo de reposición (h)
    readOnly: true
    x-computed: true
    x-regulatory-parameter: apg.max_restoration_hours
