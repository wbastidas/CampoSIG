[project]
name = "sigec-backend"
version = "0.1.0"
description = "SIGEC-Campo backend — field work management for an electric distribution utility"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "geoalchemy2>=0.16",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "httpx>=0.28",
    "redis>=5.2",
    "celery>=5.4",
    "python-jose[cryptography]>=3.3",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    # Randomised order: catches tests that leak state into one another, which is how the
    # lru_cached profile objects bit us once already.
    "pytest-randomly>=3.16",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Marca los tests que necesitan PostgreSQL; se excluyen con -m "not integration".
markers = ["integration: requiere PostgreSQL con PostGIS"]

[tool.mypy]
python_version = "3.12"
strict = true
# Los paquetes de terceros sin stubs no deben bloquear el build.
ignore_missing_imports = true
